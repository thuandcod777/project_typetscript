version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Containerfile
    image: tnh_cargo_typescript_app:latest
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_DB=mongodb://mongo:27017/tnh_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data: {}
  redis_data: {}
